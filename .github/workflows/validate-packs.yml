# Checks the configuration and all packs on every push and pull request that
# changes packs, configuration or validator code. Nothing is written to the
# repository. The results are kept by GitHub with the run:
# - the complete report on the run's summary page (job summary),
# - annotations, attached to the job's check run: shown on the run's page and
#   in the commit's "Checks"; next to the code only in a pull request's
#   "Files changed" tab, and only for lines the pull request changes.
#   GitHub keeps at most 10 annotations per level (error, warning, notice) per
#   step; the validator then says how many more there are.
# - the full text report in the step log ("Full report" group).
# Same checks as "Pack validation" in the app; see
# documentation/RESQUE-Pack-Guide.md ("Validator rules").
# In a fork, enable workflows once in the repository's "Actions" tab.
name: Validate packs

on:
  push:
    paths:
      - 'packs/**'
      - 'config/**'
      - 'utils/**'
      - 'menu.js'
      - 'index.html'
      - 'validator.html'
      - 'scripts/validate-packs.cjs'
      - 'tests/**'
      - '.github/workflows/validate-packs.yml'
  pull_request:
    paths:
      - 'packs/**'
      - 'config/**'
      - 'utils/**'
      - 'menu.js'
      - 'index.html'
      - 'validator.html'
      - 'scripts/validate-packs.cjs'
      - 'tests/**'
      - '.github/workflows/validate-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails on blocking errors: errors in stable packs of active output types.
      # Add --strict to fail on every error and warning.
      - name: Validate configuration and packs
        run: node scripts/validate-packs.cjs --all --format github --summary "$GITHUB_STEP_SUMMARY"
      - name: Validator tests
        run: |
          node tests/verify-pack-validator.cjs
          node tests/verify-validate-cli.cjs
          node tests/verify-packs.cjs . > verification-results.json
