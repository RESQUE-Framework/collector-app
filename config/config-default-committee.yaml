# ================================================================= #
# Example configuration for a hiring committee deployment of the
# RESQUE Collector App.
#
# Everybody who fills in this form is an applicant: the "Who enters the
# data?" question is answered by this configuration (see `preset` in the
# `meta` section below) instead of being asked.
#
# This file is a template, not an automatically loaded configuration.
# Copy it to config/config.yaml and edit the settings there.
# (The app reads config/config.yaml and falls back to
# config/config-default.yaml; no other file name is loaded.)
# ================================================================= #


#----------------------------------------------------------------
# Styling

# Title of the app (shown on top left)
main_title: "RESQUE - XYZ University"

# Background color of the app
background_color: "#ffffff"

# Should the scoring box on the top right be hidden?
hide_score: false

# Show the welcome message (text is defined in config/instructions.md)
show_instruction: true

# Show the beta warning message
show_beta_warning: false

# Add a logo to the top left (next to the title) and to the welcome message
# (if show_instruction is true). Set the URL of your institution's logo here,
# the size is automatically adjusted. If you don't want a logo, set this to an empty string.
image_url: ""


#----------------------------------------------------------------
# Committee settings

# Should these committee limits even be used? (Relevant for data export)
committee_limits: true

# Minimum number of papers that are expected by the committee
min: 5

# Maximum number of papers that are expected by the committee
max: 10

# Number of top papers that must be selected
max_top_papers: 3


#----------------------------------------------------------------
# Indicator settings
# (While nearly all indicator settings are defined in the respective packs, some settings are defined here)

# If "true": The merit statement and impact statement are only required
# for publications that are selected as "top publications"
statements_only_for_top_publications: true


#----------------------------------------------------------------
# Scoring settings

# Minimum number of papers that must be entered before
# showing a warning is shown at the scoring box
min_RO_warning_threshold: 0

# which packs should be included?
#
# `preset` answers an indicator for every respondent: the value replaces the
# pack default and the indicator is never shown in the form. It stays part of
# the form, so conditions that refer to it keep working and the answer is
# still exported. Do not use `exclude` for such indicators: excluding removes
# them from the form, and every condition that refers to them is then reported
# as an error by the pack validation.
meta:
  sources: ["packs/core-meta.json"]
  exclude: []
  preset:
    # All respondents are applicants, so the rater question is pre-answered here.
    # core-meta.json and core-pub.json use meta$RaterType in their conditions;
    # with this preset, the applicant branches stay active and the
    # external-rater questions stay hidden.
    RaterType: "Applicant"
  config:
    min_indicators_warning_threshold: 0

pub:
  active: true
  sources: ["packs/core-pub.json"]
  exclude: []
  config:
    min_indicators_warning_threshold: 0
    # Define the scoring categories
    #--------------------------------
    # For the cue field (which is a RegExp on the indicator IDs),
    # use | to separate multiple cues.
    # For the report generation in the RESQUER package, use these
    # standardized category titles:
    # "Open Data", "Open Materials", "Preregistration","Reproducible Code"
    # (They are also regExp'ed, so you can add additional text, e.g.,
    # "Reproducible Code & Verification" will also work)
    score_categories:
      - title: "Open Data"
        cue: "Data"
        color: '#beaed4'

      - title: "Open Materials"
        cue: "OpenMaterials"
        color: '#fdc086'

      - title: "Preregistration & Replication"
        cue: "Prereg"
        color: '#d95f02'

      - title: "Reproducible Code & Verification"
        cue: "ReproducibleScripts|IndependentVerification"
        color: '#386cb0'

      - title: "Methodological Rigor"
        cue: "_Methods_"
        color: '#f0027f'

data:
  active: false
  sources: ["packs/core-data.json"]
  exclude: []
  config:
    min_indicators_warning_threshold: 0

software:
  active: false
  sources: ["packs/core-software.json"]
  exclude: []
  config:
    min_indicators_warning_threshold: 0
